# 부하 측정 전용 프로파일 (compose의 SPRING_PROFILES_ACTIVE=load).
# 여기 있는 값은 전부 측정 조건이다 — 10회 측정이 끝날 때까지 바꾸지 않는다.

# 시딩한 유저 3만 명이 앱 재기동에도 살아남아야 한다.
spring.jpa.hibernate.ddl-auto=update

# 발급 경로는 요청당 SQL 4개다. 도착률 6,000/s면 초당 24,000줄이 되고,
# 그 시점부터 측정 대상은 락 경합이 아니라 로깅이 된다.
spring.jpa.show-sql=false
logging.level.org.hibernate.orm.jdbc.bind=OFF

# 캠페인은 측정 직전에 STOCK을 주입해 SQL로 직접 만든다.
app.seed.enabled=false

# 기본값(200)과 같지만 명시한다 — 측정 조건을 프레임워크 기본값에 맡기지 않는다.
server.tomcat.threads.max=200

# 기본 프로파일과 같지만 명시한다 — 측정 조건을 상속에 맡기지 않는다.
spring.jpa.open-in-view=false

# VU 1명이 1회만 쏘는 정상 시나리오에서는 아무도 걸리지 않아야 한다.
# 차단이 잡히면 값이 잘못됐거나 스크립트가 바뀐 것이다.
app.ratelimit.issue.limit=5
app.ratelimit.issue.window-seconds=1

management.endpoints.web.exposure.include=health,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.minimum-expected-value.http.server.requests=1ms
management.metrics.distribution.maximum-expected-value.http.server.requests=10s
